name: Build (Windows)

# A tag is the only thing that ships, so it is the only thing that builds by
# itself. A manual run builds the same stable installer without publishing it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Any job starts with no token scope and must ask for what it needs.
permissions: {}

jobs:
  build:
    runs-on: windows-latest

    # For the release step; the default token is read-only.
    permissions:
      contents: write

    steps:
      # Third-party actions are pinned to commit SHAs, not tags. A tag is mutable:
      # whoever controls the action repo can repoint it, and that is how the
      # tj-actions/changed-files compromise reached every workflow at once.
      # Bump these deliberately; the trailing comment is the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes; don't leave a usable token in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The exe's version resource is what the updater compares, so a release
      # carries its tag's version even if the bump commit was skipped.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bun scripts/set-version.ts ${{ github.ref_name }}

      - run: bun install --frozen-lockfile
        working-directory: frontend

      # Builds the stable-channel exe into bin/, then the per-user NSIS installer beside it.
      - run: wails3 task package EXTRA_TAGS=stable

      # The updater's default matcher picks VexWave-windows-amd64.exe and checks
      # it against SHA256SUMS; the installer is for first installs.
      - name: Name the release assets
        shell: bash
        run: |
          mkdir release
          cp bin/VexWave.exe release/VexWave-windows-amd64.exe
          cp bin/VexWave-amd64-installer.exe release/VexWave-installer.exe
          (cd release && sha256sum VexWave-windows-amd64.exe VexWave-installer.exe > SHA256SUMS)
          cat release/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: VexWave-win-x64
          path: release/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
